server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://hub.scanupload.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression for text-based assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml+rss;
    gzip_min_length 256;

    client_max_body_size 20M;
}