server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # No nginx reverse proxy: the SPA connects directly to the hub. The hub
    # URL is inlined into the bundle at build time via VITE_SESSION_URL,
    # so the browser opens wss://hub.scanupload.net/... for SignalR and
    # POSTs to https://hub.scanupload.net/api/v2/front-end/session.
    # CSP must allow both schemes (https:// for the POST, wss:// for the
    # notification hub) — CSP does NOT implicitly map https to wss.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml+rss;
    gzip_min_length 256;

    client_max_body_size 20M;

    add_header Content-Security-Policy "
        default-src 'self';
        img-src 'self' blob: data:;
        script-src 'self' https://static.cloudflareinsights.com;
        frame-src 'self' ${FRAME_SRC};
        connect-src 'self' ${CONNECT_SRC};
        style-src 'self' 'unsafe-inline';
        object-src 'none';
        base-uri 'self';
    " always;
}