server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Production equivalent of the Vite development mock. The demo only needs
    # a successful JSON response to show the Uppy upload flow; no file is kept.
    location = /demo-upload {
        default_type application/json;
        return 200 '{"url":"mock://received","mock":true}';
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # No nginx reverse proxy: the SPA connects directly to the hub. The hub
    # URL is inlined into the bundle at build time via VITE_SESSION_URL,
    # so the browser opens wss://hub.scanupload.net/... for SignalR and
    # POSTs to https://hub.scanupload.net/api/v2/front-end/session.
    # CSP must allow both schemes (https:// for the POST, wss:// for the
    # notification hub) — CSP does NOT implicitly map https to wss.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml+rss;
    gzip_min_length 256;

    client_max_body_size 20M;

    # The Angular demo runs the browser JIT compiler (see `main.ts` and the
    # `jit: true` plugin option in `vite.config.js`), which evaluates generated
    # component code, so this policy needs 'unsafe-eval'. The other demos do not.
    #
    # Keep comments OUTSIDE this string. A '#' inside the policy is parsed as a
    # directive name, and everything up to the next ';' is discarded with it —
    # which silently deletes `script-src` and drops the app back to
    # `default-src 'self'`. That blocks both the JIT compiler and the
    # Cloudflare beacon, and the browser reports it as "'script-src-elem' was
    # not explicitly set".
    add_header Content-Security-Policy "
        default-src 'self';
        img-src 'self' blob: data:;
        script-src 'self' 'unsafe-eval' https://static.cloudflareinsights.com;
        frame-src 'self' ${FRAME_SRC};
        connect-src 'self' ${CONNECT_SRC};
        style-src 'self' 'unsafe-inline';
        object-src 'none';
        base-uri 'self';
    " always;
}